  public:
    board:
      header: Algemeen bestuur
      intro: "Het komende jaar mogen wij als XLVIIe Senaat ons bezig houden met Alpha en haar activiteiten. Wij hebben zin in het komende jaar,
        met alles wat ons daarin te wachten staat. We zullen samen bouwen aan mooie momenten en zorg dragen voor alles wat op ons pad komt.
        Onze bijbeltekst vat dit vertrouwen samen:"
      slogan: “Daarom zeg ik nog een keer, Je moet sterk en dapper zijn. Je hoeft nergens bang voor te zijn. Want ik ben je God. Ik ben altijd bij je, waar je ook heen gaat.” - Jozua 1:9 BGT
      senaat: De XLVIIe Senaat der C.S.V. Alpha
      chair: Praeses
      chair-name: Daphne Vader
      chair-story: Hii allemaal! Ik ben Daphne, dit jaar Praeses van Alpha. Ik ben derdejaars student en studeer Biomedische Technologie, maar dit jaar staat mijn studie even op een lager pitje. Als Praeses ben ik eindverantwoordelijk voor alles wat er binnen Alpha gebeurt. Ik zit de vergaderingen voor, zorg voor de uitvoering van ons beleid, geef speeches en begeleid zowel commissies als mijn medebestuurders bij hun taken. Daarnaast beheer ik ook de financiën van onze mooie Sociëteit Flux.
      secretary: Abactis
      secretary-name: Manou van der Heijden
      secretary-story: Heyhoihallooo, mijn naam is Manou en dit jaar ben ik de Abactis der C.S.V. Alpha. De afgelopen twee jaar heb ik Applied Mathematics gestudeerd, maar deze dagen hou ik me meer bezig met besturen. Dit houdt in dat ik verantwoordelijk ben voor allerlei soorten contact, zowel elektronisch als schriftelijk, ik ga over de ledenadministratie en ik notuleer natuurlijk alle vergaderingen. Daarnaast ben ik onderdeel van het Fact-bestuur als Penningmeester.
      treasurer: Quaestor
      treasurer-name: Jonna Werkman
      treasurer-story: Hoi, mijn naam is Jonna en ik mag dit jaar de Quaestor zijn van Alpha. Normaal gezien zou ik nu in mijn derde jaar van de bachelor Technische Geneeskunde zitten maar dit jaar neem ik een tussenjaar en ga ik aan de slag als bestuurder van Alpha. Als Quaestor ben ik verantwoordelijk voor de financiële zaken van Alpha, dit houdt in dat ik de begroting maak, de boekhouding bijhoud, incasso’s uitvoer en de penningmeesters van de commissies begeleid.
      assessor1: Assessor Internorum
      assessor1-name: Jorick Schotsman
      assessor1-story: Hoi allemaal, mijn naam is Jorick Schotsman. Ik ben dit jaar derdejaars Alphaan en heb de afgelopen 3 jaar Industrial Design Engineering gestudeerd. Dit jaar heb ik de eer om de rol van de Assessor Internorum op te mogen nemen. Dat houdt in dat ik me bezighoud met alle interne zaken van de vereniging, waaronder ook het opzetten van de kringen en het begeleiden van het ledenzorgteam. Daarnaast zal ik nog veel kleine projecten oppakken en bijspringen waar nodig is.
      assessor2: Assessor externorum
      assessor2-name: Geert Almekinders
      assessor2-story: Hoi, ik ben Geert, ben derdejaars student en studeer psychologie. Dit jaar zal ik de taak van assessor externorum op mij nemen in het algemeen bestuur van C.S.V. Alpha. Dit houdt in dat ik Alpha zal vertegenwoordigen bij verscheidene externe verbanden, op zoek zal gaan naar nieuwe partners, en zal ik aan de externe representatie van Alpha gaan werken. Daarnaast zal ik in het sociëteitsbestuur de rol van onderhoud op mij nemen en zal ik Alpha vertegenwoordigen bij de BCP. Verder zal ik mij bezighouden met verschillende projectjes, en begeleid ik een aantal commissies.
      photographer: Ook mooie foto's? Onze fotograaf
      photographer-url: https://shinebrightfotografie.nl/
